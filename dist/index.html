<!DOCTYPE html>
<html lang="lo">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ແມວລາວ NekoLao — ສວນປະຕູໄຊ ວຽງຈັນ 3D</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%23ffd166'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-size='36'>🐾</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+Lao:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-glass: rgba(28, 22, 18, 0.76);
        --bg-glass-light: rgba(255, 248, 235, 0.14);
        --border-gold: rgba(255, 209, 102, 0.42);
        --accent-gold: #ffd166;
        --accent-turquoise: #2ec4b6;
        --accent-coral: #ff7b54;
        --text-cream: #fff9f0;
        --text-muted: #e2d4c0;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      html,
      body {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        width: 100dvw;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-text-size-adjust: 100%;
        background: #14100d;
        font-family: 'Noto Sans Lao', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--text-cream);
      }

      #game-container {
        position: fixed;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        width: 100dvw !important;
        height: 100dvh !important;
        touch-action: none;
        z-index: 1;
      }

      #hud-root {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 20;
        pointer-events: none;
      }

      #hud-root dialog,
      #hud-root dialog *,
      #hud-root button,
      #hud-root button *,
      #hud-root input,
      .nl-start-dialog,
      .nl-menu-dialog,
      .nl-coat-dialog,
      .nl-victory-dialog {
        pointer-events: auto !important;
      }

      canvas {
        display: block;
        position: absolute;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        touch-action: none;
      }
    </style>
    <script>
      // Prevent browser webpage pinch-zoom and double-tap zoom on iOS Safari & Mobile Chrome
      document.addEventListener(
        'gesturestart',
        function (e) {
          e.preventDefault();
        },
        { passive: false }
      );
      document.addEventListener(
        'gesturechange',
        function (e) {
          e.preventDefault();
        },
        { passive: false }
      );
      document.addEventListener(
        'gestureend',
        function (e) {
          e.preventDefault();
        },
        { passive: false }
      );
      document.addEventListener(
        'dblclick',
        function (e) {
          e.preventDefault();
        },
        { passive: false }
      );
      document.addEventListener(
        'touchmove',
        function (e) {
          if (e.touches && e.touches.length > 1) {
            e.preventDefault();
          }
        },
        { passive: false }
      );
    </script>
    <script type="module" crossorigin src="/assets/index-BLs1anRn.js"></script>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="hud-root"></div>
  </body>
</html>
